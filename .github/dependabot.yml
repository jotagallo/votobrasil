# Dependabot reads this file from the default branch (main); PRs target dev, where development
# happens, and reach main with the next dev -> main merge.
version: 2

updates:
  - package-ecosystem: npm
    directories:
      - '/'
      - '/apps/*'
      - '/packages/*'
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Types follow the Node.js major the project runs (.nvmrc and Elastic Beanstalk);
      # bump them by hand together with Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint does not support TypeScript 7 yet; remove once it does.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: terraform
    directory: '/infra/terraform'
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns:
          - '*'
