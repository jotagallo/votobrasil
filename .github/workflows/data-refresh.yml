# Rebuilds the processed datasets from the official TSE/IBGE sources without any cache and fails if
# validation fails. It never deploys: download the artifact to inspect it, then ship new data by
# bumping data/VERSION in a commit to main (the deploy workflow rebuilds on the changed cache key).
name: Data refresh

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Rebuild and validate datasets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build datasets
        run: npm run data:build

      - name: Validate datasets
        run: npm run data:validate

      - name: Summary
        run: |
          {
            echo "### Processed datasets"
            echo "- Built at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Files: $(find data/processed -type f | wc -l)"
            echo "- Size: $(du -sh data/processed | cut -f1)"
            if [ -f data/VERSION ]; then echo "- data/VERSION: \`$(cat data/VERSION)\`"; fi
            echo
            echo "Not deployed. To ship this data, bump \`data/VERSION\` on main."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: processed-data
          path: data/processed
          retention-days: 30
          if-no-files-found: error
