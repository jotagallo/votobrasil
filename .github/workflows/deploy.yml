# Deploys the commit that passed CI on main (or rolls back to an existing version label).
#
# Job split on purpose: `build` runs npm scripts (third-party code) with no AWS access and no
# environment secrets; only `deploy`, which runs AWS CLI commands and nothing from npm, can request
# an OIDC token. Pending deploys are serialised so two runs never update the environment at once.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: Existing Elastic Beanstalk application version label to redeploy (skips the build)
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build bundle
    # workflow_run fires for every CI run, including fork pull requests whose branch is called
    # "main"; only same-repository push runs that succeeded are deployable.
    if: >-
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'workflow_dispatch' && inputs.rollback_to == '') ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      label: ${{ steps.meta.outputs.label }}
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
      VITE_UMAMI_SRC: ${{ vars.VITE_UMAMI_SRC || 'https://cloud.umami.is/script.js' }}
      VITE_SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Version label
        id: meta
        run: echo "label=${SOURCE_SHA}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # Restored before `npm ci` so node_modules never leaks into the key. Official data changes
      # rarely: bump data/VERSION (or touch packages/etl) to force a rebuild.
      - name: Restore processed datasets
        id: data-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/processed
          key: data-${{ hashFiles('packages/etl/**', '!packages/etl/node_modules/**', '!packages/etl/dist/**', 'data/VERSION') }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build datasets (cache miss)
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: npm run data:build

      - name: Validate datasets
        run: npm run data:validate

      - name: Build
        run: npm run build

      - name: Bundle
        run: npm run bundle

      - name: Check bundle contents
        run: |
          entries="$(unzip -Z1 dist/bundle.zip)"
          for required in server.mjs Procfile web/index.html; do
            echo "$entries" | grep -qx "$required" || { echo "::error::bundle is missing $required"; exit 1; }
          done
          echo "$entries" | grep -q '^data/.\+' || { echo "::error::bundle contains no datasets"; exit 1; }
          ls -lh dist/bundle.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: dist/bundle.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  deploy:
    name: Deploy to Elastic Beanstalk
    needs: build
    if: >-
      ${{ !cancelled() && (
        needs.build.result == 'success' ||
        (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch' &&
          inputs.rollback_to != '' && github.ref == 'refs/heads/main')
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EB_APPLICATION: ${{ vars.EB_APPLICATION }}
      EB_ENVIRONMENT: ${{ vars.EB_ENVIRONMENT }}
      ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      ROLLBACK_TO: ${{ inputs.rollback_to }}
      VERSION_LABEL: ${{ inputs.rollback_to || needs.build.outputs.label }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check configuration
        run: |
          fail=0
          check() {
            if [ -z "$2" ]; then echo "::error::$1 is empty (set it as a variable of the production environment or the repository)"; fail=1; fi
          }
          check AWS_REGION "$AWS_REGION"
          check EB_APPLICATION "$EB_APPLICATION"
          check EB_ENVIRONMENT "$EB_ENVIRONMENT"
          check ARTIFACTS_BUCKET "$ARTIFACTS_BUCKET"
          check CLOUDFRONT_DISTRIBUTION_ID "$CLOUDFRONT_DISTRIBUTION_ID"
          check SITE_URL "$SITE_URL"
          check VERSION_LABEL "$VERSION_LABEL"
          [ "$fail" = 0 ] || exit 1
          [[ "$VERSION_LABEL" =~ ^[A-Za-z0-9._-]{1,100}$ ]] || { echo "::error::invalid version label"; exit 1; }

      - name: Download bundle
        if: env.ROLLBACK_TO == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: bundle

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Upload bundle and register application version
        if: env.ROLLBACK_TO == ''
        run: |
          aws s3 cp bundle/bundle.zip "s3://${ARTIFACTS_BUCKET}/${VERSION_LABEL}.zip" --only-show-errors
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION_LABEL" \
            --description "${GITHUB_REPOSITORY}@${SOURCE_SHA} (run ${GITHUB_RUN_ID})" \
            --source-bundle "S3Bucket=${ARTIFACTS_BUCKET},S3Key=${VERSION_LABEL}.zip" \
            --no-auto-create-application \
            --output text --query 'ApplicationVersion.VersionLabel'

      - name: Update environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$VERSION_LABEL" \
            --output text --query '[EnvironmentName,Status,VersionLabel]'
          aws elasticbeanstalk wait environment-updated --environment-names "$EB_ENVIRONMENT"

      - name: Wait for green health
        run: |
          for attempt in $(seq 1 30); do
            read -r status health version < <(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENVIRONMENT" \
              --query 'Environments[0].[Status,Health,VersionLabel]' --output text)
            echo "attempt ${attempt}: status=${status} health=${health} version=${version}"
            if [ "$status" = "Ready" ] && [ "$health" = "Green" ] && [ "$version" = "$VERSION_LABEL" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::environment did not become Ready/Green on ${VERSION_LABEL}"
          exit 1

      - name: Show recent environment events
        if: failure()
        run: |
          aws elasticbeanstalk describe-events --environment-name "$EB_ENVIRONMENT" --max-items 25 \
            --query 'Events[].[EventDate,Severity,Message]' --output text || true

      - name: Invalidate CloudFront
        run: |
          id="$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths '/*' \
            --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --id "$id"

      - name: Smoke test through CloudFront
        run: |
          url="${SITE_URL%/}"
          body="$(curl -fsS --retry 6 --retry-delay 5 --retry-all-errors --max-time 20 "${url}/healthz")"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          curl -fsS -o /dev/null --retry 3 --retry-delay 5 --retry-all-errors --max-time 20 "${url}/"

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo "- Version: \`${VERSION_LABEL}\`"
            echo "- Site: ${SITE_URL}"
            if [ -n "$ROLLBACK_TO" ]; then echo "- Rollback of an existing version (no build)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
